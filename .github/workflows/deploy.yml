name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Compile resume/resume.tex into the PDF the site serves at /resume.
      # Skipped until the .tex file is committed; public/resume.pdf is used as is.
      - name: Build resume PDF
        if: hashFiles('resume/resume.tex') != ''
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: resume
          root_file: resume.tex
      - name: Publish resume PDF into the site
        if: hashFiles('resume/resume.tex') != ''
        run: cp resume/resume.pdf public/resume.pdf
      - name: Attach resume PDF to the run
        if: hashFiles('resume/resume.tex') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume/resume.pdf
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_ANALYTICS: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
